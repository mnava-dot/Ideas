<title>Atlas de Gestores 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de trabajo cartográfica — gestores a la izquierda, mapa al centro, ficha de análisis a la derecha; en teléfono se apila. */
:root{
  --bg:#E9EEEC; --panel:#FBFCFB; --ink:#14201D; --muted:#5B6A66; --line:#D3DCD9;
  --land:#F4F6F5; --munline:#C9D3D0; --edoline:#7D8E89; --sea:#DCE6E3;
  --accent:#0E6B60; --accent-ink:#FFFFFF; --hi:#14201D; --chip:#EEF2F1; --warn:#B4541A;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1312; --panel:#141C1B; --ink:#E3ECE9; --muted:#93A39F; --line:#26322F;
  --land:#1B2523; --munline:#2B3835; --edoline:#5F726D; --sea:#0F1716;
  --accent:#4FC2B1; --accent-ink:#06201C; --hi:#FFFFFF; --chip:#1C2725; --warn:#F0A060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1312; --panel:#141C1B; --ink:#E3ECE9; --muted:#93A39F; --line:#26322F;
  --land:#1B2523; --munline:#2B3835; --edoline:#5F726D; --sea:#0F1716;
  --accent:#4FC2B1; --accent-ink:#06201C; --hi:#FFFFFF; --chip:#1C2725; --warn:#F0A060; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand h1{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.kpis{display:flex;gap:20px;flex-wrap:wrap}
.kpi b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.search{position:relative;margin-left:auto;min-width:0;flex:0 1 320px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.results{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button.on{background:var(--chip)}
.results small{color:var(--muted)}
.main{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:12px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane h2{font-family:var(--f-display);font-stretch:85%;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--muted)}
.gest-head{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.gest-list{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.g{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;width:100%}
.g:hover{background:var(--chip)}
.g.on{background:var(--chip);border-color:var(--gc)}
.g .sw{width:14px;height:14px;border-radius:4px;background:var(--gc)}
.g .nm{font-weight:600;font-size:13px;line-height:1.2}
.g .sub{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.g .ct{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.g.dim{opacity:.45}
.filters{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 9px;font-size:11px}
.chip.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.seg[aria-pressed="false"]{background:none;color:var(--ink);text-decoration:none}
.chip:not(.seg)[aria-pressed="false"]{background:none;color:var(--muted);text-decoration:line-through}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mapwrap{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:360px}
#map{width:100%;height:100%;display:block;touch-action:none}
.m{stroke:var(--munline);stroke-width:.35;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .25s}
.m:hover{stroke:var(--hi);stroke-width:1.2}
.m.sel{stroke:var(--hi);stroke-width:2.2}
.edo{fill:none;stroke:var(--edoline);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:16px;line-height:1}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 20px)}
.legend .row{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px}
.scale{width:120px;height:10px;border-radius:2px}
.proj{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:260px}
.tip b{display:block;font-size:13px}
.tip .gs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 6px;border:0;background:none;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabbody{overflow:auto;padding:14px;min-height:0;flex:1}
.tabbody h3{font-family:var(--f-display);font-stretch:82%;font-size:22px;font-weight:800;margin:0;line-height:1.1;text-wrap:balance}
.meta{color:var(--muted);font-size:12px;margin:3px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--chip);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sec{margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--chip)}
.tblwrap{overflow-x:auto;max-width:100%}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{border-color:#2E9D6B;color:#2E9D6B}
.pill.bad{border-color:var(--warn);color:var(--warn)}
.inm{padding:8px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.inm .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.inm .t b{font-size:13px}
.inm small{color:var(--muted);font-size:11px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{color:var(--muted);padding:20px 4px;text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-stretch:85%;font-size:18px;margin-bottom:4px}
.dist-hero{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:12px}
.dist-hero .end{background:var(--chip);border-radius:8px;padding:8px 10px;min-width:0}
.dist-hero .end small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dist-hero .end b{display:block;overflow-wrap:anywhere}
.arrow{font-family:var(--f-mono);color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.big div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.big b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.big span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{font-size:11px;color:var(--muted)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.matrix td,.matrix th{padding:3px 5px;font-size:10px;text-align:right;font-family:var(--f-mono);border:0;white-space:nowrap}
.matrix th{position:static}
.matrix th.rh{text-align:left;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:11px;color:var(--ink);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.stop:hover{background:var(--chip)}
.stop .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--f-mono)}
.stop small{display:block;color:var(--muted);font-size:11px}
.ov-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ov-dist{stroke:var(--hi);stroke-dasharray:6 5}
.ov-lbl{font-family:var(--f-mono);font-size:11px;font-weight:500;paint-order:stroke;stroke:var(--panel);stroke-width:3px;fill:var(--ink)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px}

.cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;background:var(--chip);border-radius:8px;padding:10px;margin-bottom:12px}
.cfg label{display:flex;flex-direction:column;gap:3px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
.cfg select,.cfg input[type=number],.cfg input[type=date],.cfg input[type=time]{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
.cfg label.chk{flex-direction:row;align-items:center;gap:6px;align-self:end;padding-bottom:6px}
details.incl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:10px 0}
details.incl summary{cursor:pointer;font-weight:600;font-size:12px}
.mrow{display:flex;gap:6px;align-items:baseline;padding:3px 0;font-size:12px}
.day{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden}
.day.on{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc)}
.dh{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 10px}
.dh:hover{background:var(--chip)}
.dh .dn{width:26px;height:26px;border-radius:7px;background:var(--gc);color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px}
.dh small{display:block;color:var(--muted);font-size:11px}
.dm{text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.dsum{padding:0 10px 8px 48px}
.tlw{padding:2px 10px 10px;display:flex;flex-direction:column;gap:2px}
.tl{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12px;padding:2px 0}
.tl .hr{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tl.drv span.note{border-left:2px dotted var(--line);padding-left:8px;margin-left:2px}
.tl .inl{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tlw a.btn{align-self:flex-start;margin-top:6px;text-decoration:none;color:var(--ink)}
@media (max-width:1100px){.main{grid-template-columns:220px minmax(0,1fr)}.panel{grid-column:1/-1;max-height:none}}
@media (max-width:720px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .mapwrap{height:62vh;order:1}
  .gestores{order:2;max-height:340px}
  .panel{order:3;height:80vh}
  .search{flex:1 1 100%;order:3}
  .legend{font-size:10px}
}
@media (prefers-reduced-motion:reduce){.m{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Atlas de Gestores 2027</h1>
      <p id="fuente">Asignación por municipio · límites INEGI 2023</p>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar municipio (ej. Tampico, Zapopan)…" autocomplete="off" aria-label="Buscar municipio">
      <div class="results" id="qres" hidden></div>
    </div>
  </header>

  <div class="main">
    <aside class="pane gestores">
      <div class="gest-head"><h2>Gestores</h2><button class="btn" id="todos">Ver todos</button></div>
      <div class="gest-list" id="glist"></div>
      <div class="filters">
        <span class="lbl">Proyecto</span>
        <div class="chips" id="fproy"></div>
        <span class="lbl">Estatus del inmueble</span>
        <div class="chips" id="fest"></div>
      </div>
    </aside>

    <section class="mapwrap" aria-label="Mapa de municipios">
      <svg id="map" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="loading" id="loading">Cargando 2,475 municipios…</div>
      <div class="mapctl">
        <button id="zin" aria-label="Acercar">+</button>
        <button id="zout" aria-label="Alejar">−</button>
        <button id="zreset" aria-label="Ver todo México" title="Ver todo México">⌂</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="proj">Lambert conforme · 17.5°N / 29.5°N</div>
    </section>

    <aside class="pane panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-mun" aria-selected="true">Municipio</button>
        <button role="tab" id="t-dist" aria-selected="false">Distancias</button>
        <button role="tab" id="t-ruta" aria-selected="false">Planificador</button>
      </div>
      <div class="tabbody" id="tb"></div>
    </aside>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>window.d3||document.write('<script src="vendor/d3.min.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"></script>
<script>window.topojson||document.write('<script src="vendor/topojson-client.min.js"><\/script>')</script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const _nf=new Intl.NumberFormat('es-MX');const fmt=v=>_nf.format(v);
const ROAD=1.3; // factor carretera sobre línea recta
const PALETTE=['#E4572E','#2E86AB','#8E5BD0','#17A673','#E8A33D','#D6457A','#2BB3C0','#9C7A3C','#5C7CFA','#9AA82C','#C964D9','#4E9A52','#C0392B','#7A8A99','#2C5F8A'];

const [topo,etopo,inm]=await Promise.all(['data/municipios.topo.json','data/estados.topo.json','data/inmuebles.json'].map(u=>fetch(u).then(r=>r.json())));
$('#loading').remove();

const feats=topojson.feature(topo,topo.objects.mun).features;
const M=new Map(feats.map(f=>[f.properties.id,f]));
const C=inm.cols.reduce((o,c,i)=>(o[c]=i,o),{});
const ROWS=inm.rows;
const short=s=>s.replace(/ de Ignacio de la Llave| de Zaragoza| de Ocampo/,'');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
feats.forEach(f=>{f.properties.q=norm(f.properties.n+' '+f.properties.s)});

// gestor colores por tamaño de cartera
const gcount=d3.rollup(ROWS,v=>v.length,r=>r[C.gestor]);
const GESTORES=[...gcount.keys()].filter(Boolean).sort((a,b)=>gcount.get(b)-gcount.get(a));
const GC=new Map(GESTORES.map((g,i)=>[g,PALETTE[i%PALETTE.length]]));
const PROY=[...new Set(ROWS.map(r=>r[C.proyecto]))];
const EST=[...d3.rollup(ROWS,v=>v.length,r=>r[C.estatus])].sort((a,b)=>b[1]-a[1]).map(d=>d[0]);

const S={gestor:null,mun:null,tab:'mun',proy:new Set(PROY),est:new Set(EST),distTo:null,base:null,pickDest:false,stateTable:'estado'};

function hav(a,b){const R=6371,t=Math.PI/180;const p1=a.cy*t,p2=b.cy*t,dp=(b.cy-a.cy)*t,dl=(b.cx-a.cx)*t;const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const km=(a,b)=>hav(M.get(a).properties,M.get(b).properties);
const hrs=k=>{const h=k*ROAD/CFG.spd;const H=Math.floor(h),mm=Math.round((h-H)*60);return H?`${H} h ${String(mm).padStart(2,'0')}`:`${mm} min`};

// agregados con filtros
let AG; // {mun: Map id->{n, byG:Map}, g: Map gestor->{n, muns:Map id->n, edos:Set}}
function aggregate(){
  const mun=new Map(),g=new Map();
  for(const r of ROWS){
    if(!S.proy.has(r[C.proyecto])||!S.est.has(r[C.estatus]))continue;
    const id=r[C.cve],gg=r[C.gestor];
    if(id){let m=mun.get(id);if(!m)mun.set(id,m={n:0,byG:new Map()});m.n++;m.byG.set(gg,(m.byG.get(gg)||0)+1)}
    let x=g.get(gg);if(!x)g.set(gg,x={n:0,muns:new Map(),edos:new Set()});x.n++;
    if(id){x.muns.set(id,(x.muns.get(id)||0)+1);x.edos.add(short(M.get(id).properties.s))}
  }
  AG={mun,g};
}

// ---------- mapa ----------
const W=1000,H=680;
const svg=d3.select('#map');
const proj=d3.geoConicConformal().parallels([17.5,29.5]).rotate([102,0]).fitExtent([[14,14],[W-14,H-14]],topojson.feature(etopo,etopo.objects.edo));
const path=d3.geoPath(proj);
feats.forEach(f=>{const p=proj([f.properties.cx,f.properties.cy]);f.properties.px=p[0];f.properties.py=p[1]});
const defs=svg.append('defs');
const zg=svg.append('g');
const gm=zg.append('g');
const muns=gm.selectAll('path').data(feats).join('path').attr('class','m').attr('d',path);
zg.append('path').attr('class','edo').attr('d',path(topojson.mesh(etopo,etopo.objects.edo)));
const ov=svg.append('g');

function zoomToIds(ids,maxK=40){
  if(!ids.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of ids){const b=path.bounds(M.get(id));x0=Math.min(x0,b[0][0]);y0=Math.min(y0,b[0][1]);x1=Math.max(x1,b[1][0]);y1=Math.max(y1,b[1][1])}
  const k=Math.min(maxK,0.85/Math.max((x1-x0)/W,(y1-y0)/H));
  svg.transition().duration(750).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2));
}

// rayas para municipios compartidos
const patt=new Map();
function stripe(cols){
  const key=cols.join('|');if(patt.has(key))return patt.get(key);
  const id='p'+patt.size;const p=defs.append('pattern').attr('id',id).attr('patternUnits','userSpaceOnUse').attr('width',4*cols.length).attr('height',4*cols.length).attr('patternTransform','rotate(45)');
  cols.forEach((c,i)=>p.append('rect').attr('x',i*4).attr('y',0).attr('width',4).attr('height',4*cols.length).attr('fill',c));
  patt.set(key,`url(#${id})`);return patt.get(key);
}
const land=()=>getComputedStyle(document.documentElement).getPropertyValue('--land').trim();
function paint(){
  const L=land();
  let max=1;if(S.gestor){const x=AG.g.get(S.gestor);if(x)max=d3.max([...x.muns.values()])||1}
  const op=d3.scaleSqrt().domain([1,max]).range([.38,1]);
  muns.each(function(f){
    const id=f.properties.id,m=AG.mun.get(id);let fill=L,fo=1;
    if(m){
      if(S.gestor){
        const c=m.byG.get(S.gestor);
        if(c){fill=GC.get(S.gestor);fo=(S.tab==='ruta'&&exc(S.gestor).has(id))?.12:op(c)}else{fill=d3.color(GC.get([...m.byG.keys()][0])||'#999').copy({opacity:1})+'';fo=.13}
      }else{
        const gs=[...m.byG].sort((a,b)=>b[1]-a[1]).map(d=>GC.get(d[0])||'#888');
        fill=gs.length>1?stripe(gs.slice(0,3)):gs[0];fo=.9;
      }
    }
    this.setAttribute('fill',fill);this.setAttribute('fill-opacity',fo);
    this.classList.toggle('sel',id===S.mun||id===S.distTo);
  });
  muns.filter(f=>f.properties.id===S.mun||f.properties.id===S.distTo).raise();
  legend();
}
function legend(){
  const el=$('#legend');
  if(S.gestor){const c=GC.get(S.gestor);el.innerHTML=`<div class="row"><b>${S.gestor}</b></div><div class="row"><span class="note">1 inm.</span><span class="scale" style="background:linear-gradient(90deg,${c}61,${c})"></span><span class="note">${fmt(d3.max([...(AG.g.get(S.gestor)?.muns.values()||[1])]))} inm.</span></div><div class="row note">Intensidad = inmuebles en el municipio</div>`}
  else el.innerHTML=`<div class="row"><i style="background:${GC.get(GESTORES[0])}"></i>Color = gestor asignado</div><div class="row"><i style="background:repeating-linear-gradient(45deg,${GC.get(GESTORES[0])} 0 4px,${GC.get(GESTORES[4])} 4px 8px)"></i>Rayas = municipio compartido</div><div class="row"><i style="background:var(--land);border:1px solid var(--munline)"></i>Sin inmuebles</div>`;
}

// overlay: línea de distancia y ruta
function drawOverlay(){
  ov.selectAll('*').remove();
  const P=id=>{const p=M.get(id).properties;return [T.applyX(p.px),T.applyY(p.py)]};
  if(S.tab==='ruta'&&PLAN&&PLAN.days.length){
    const c=GC.get(S.gestor);const line=d3.line().curve(d3.curveCatmullRom.alpha(.5));
    PLAN.days.forEach((d,i)=>{
      const ids=[d.from,...d.items.filter(t=>t.type==='drive').map(t=>t.to)];
      const on=S.day==null||S.day===i;
      ov.append('path').attr('class','ov-line').attr('stroke',S.day===i?'var(--ink)':c).attr('stroke-width',S.day===i?3:on?2:1.2).attr('stroke-opacity',on?.85:.18).attr('stroke-dasharray',d.trip.kind==='gira'?'7 4':null).attr('d',line(ids.map(P)));
    });
    const stopIds=S.day!=null?[...new Set(PLAN.days[S.day].items.filter(t=>t.type==='visit').map(t=>t.id))]:[...new Set(PLAN.days.flatMap(d=>d.items.filter(t=>t.type==='visit').map(t=>t.id)))].filter(id=>id!==PLAN.base);
    const g=ov.selectAll('g.st').data(stopIds).join('g').attr('transform',id=>`translate(${P(id)})`);
    g.append('circle').attr('r',S.day!=null?8:3.5).attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',S.day!=null?2:1);
    if(S.day!=null)g.append('text').attr('text-anchor','middle').attr('dy','.35em').attr('fill','#fff').attr('font-size',8.5).attr('font-family','IBM Plex Mono,monospace').attr('font-weight',600).text((d,i)=>i+1);
    PLAN.days.forEach(d=>{if(d.end!==PLAN.base&&(S.day==null||PLAN.days[S.day]===d)){const q=P(d.end);ov.append('text').attr('class','ov-lbl').attr('x',q[0]+9).attr('y',q[1]-7).text('☾')}});
    const b=P(PLAN.base);const bg=ov.append('g').attr('transform',`translate(${b})`);
    bg.append('rect').attr('x',-9).attr('y',-9).attr('width',18).attr('height',18).attr('rx',4).attr('fill','var(--ink)').attr('stroke','var(--panel)').attr('stroke-width',2);
    bg.append('text').attr('text-anchor','middle').attr('dy','.35em').attr('fill','var(--panel)').attr('font-size',10).attr('font-weight',700).attr('font-family','IBM Plex Mono,monospace').text('B');
  }
  if(S.tab==='dist'&&S.mun&&S.distTo){
    const a=P(S.mun),b=P(S.distTo);
    ov.append('path').attr('class','ov-line ov-dist').attr('d',d3.line()([a,b]));
    [a,b].forEach((p,i)=>ov.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',5).attr('fill',i?'var(--accent)':'var(--ink)').attr('stroke','var(--panel)').attr('stroke-width',2));
    ov.append('text').attr('class','ov-lbl').attr('x',(a[0]+b[0])/2+8).attr('y',(a[1]+b[1])/2-8).text(fmt(Math.round(km(S.mun,S.distTo)))+' km');
  }else if(S.mun){const a=P(S.mun);ov.append('circle').attr('cx',a[0]).attr('cy',a[1]).attr('r',4).attr('fill','var(--ink)').attr('stroke','var(--panel)').attr('stroke-width',2)}
}

// ---------- buscador ----------
function search(input,box,onPick){
  let res=[],on=0;
  const show=()=>{box.hidden=!res.length;box.innerHTML=res.map((f,i)=>{const m=AG.mun.get(f.properties.id);return `<button class="${i===on?'on':''}" data-i="${i}"><span>${f.properties.n}<small> · ${f.properties.s}</small></span><small>${m?m.n+' inm.':''}</small></button>`}).join('');
    box.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();pick(+b.dataset.i)})};
  const pick=i=>{const f=res[i];if(!f)return;input.value='';res=[];show();input.blur();onPick(f.properties.id)};
  input.oninput=()=>{const q=norm(input.value.trim());on=0;
    res=q.length<2?[]:feats.filter(f=>f.properties.q.includes(q)).sort((a,b)=>(AG.mun.get(b.properties.id)?.n||0)-(AG.mun.get(a.properties.id)?.n||0)||(norm(a.properties.n).startsWith(q)?-1:1)).slice(0,8);show()};
  input.onkeydown=e=>{if(e.key==='ArrowDown'){on=Math.min(on+1,res.length-1);show();e.preventDefault()}else if(e.key==='ArrowUp'){on=Math.max(on-1,0);show();e.preventDefault()}else if(e.key==='Enter')pick(on);else if(e.key==='Escape'){res=[];show()}};
  input.onblur=()=>setTimeout(()=>{res=[];show()},120);
}

function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=o,1500)};
  navigator.clipboard?.writeText(t).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');done()}catch(_){}ta.remove()})}

// ruta: vecino más cercano + 2-opt (ids[0] puede ser la base)
function route(ids,base,loop){
  const n=ids.length;if(n<2)return{order:ids.slice()};
  const D=ids.map(a=>ids.map(b=>a===b?0:km(a,b)));
  let cur=Math.max(0,ids.indexOf(base));const seen=new Set([cur]);const ord=[cur];
  while(ord.length<n){let best=-1,bd=1e9;for(let j=0;j<n;j++)if(!seen.has(j)&&D[cur][j]<bd){bd=D[cur][j];best=j}seen.add(best);ord.push(best);cur=best}
  let improved=true,it=0;
  while(improved&&it++<80){improved=false;for(let i=1;i<n-1;i++)for(let j=i+1;j<n;j++){
    const a=ord[i-1],b=ord[i],c=ord[j],d=ord[(j+1)%n];const closes=j+1<n||loop;
    const before=D[a][b]+(closes?D[c][d]:0),after=D[a][c]+(closes?D[b][d]:0);
    if(after+1e-9<before){ord.splice(i,j-i+1,...ord.slice(i,j+1).reverse());improved=true}}}
  return{order:ord.map(i=>ids[i])};
}

// ---------- planificador de jornadas ----------
const LS='atlas-planner-v1';
const CFG={hpd:9,vis:40,spd:75,hini:'08:00',habiles:true,modo:'auto',start:null};
try{Object.assign(CFG,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(_){}
const saveCfg=()=>{try{localStorage.setItem(LS,JSON.stringify(CFG))}catch(_){}};
const EXC=new Map(); // gestor -> municipios quitados del plan
const exc=g=>{if(!EXC.has(g))EXC.set(g,new Set());return EXC.get(g)};
const dh=(a,b)=>a===b?0:km(a,b)*ROAD/CFG.spd;      // horas de manejo
const dk=(a,b)=>a===b?0:km(a,b)*ROAD;              // km carretera aprox.
const hhmm=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`};
const clock=h=>{const [H,Mi]=CFG.hini.split(':').map(Number);const m=Math.round(H*60+Mi+h*60);return `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
function nextMonday(){const d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));return d.toISOString().slice(0,10)}
let PLAN=null;

function buildPlan(g){
  const x=AG.g.get(g);if(!x)return null;
  const E=exc(g),base=S.base,B=CFG.hpd,V=CFG.vis/60;
  const ids=[...x.muns.keys()].filter(id=>!E.has(id));
  const cnt=id=>x.muns.get(id);
  const near=[],far=[];
  for(const id of ids){
    if(id===base)near.push(id);
    else if(CFG.modo==='gira')far.push(id);
    // regreso diario solo si el viaje redondo es ≤ 45% de la jornada y sus inmuebles caben en un día; si no, conviene pernoctar
    else if(CFG.modo==='diario'||(2*dh(base,id)<=B*.45&&2*dh(base,id)+cnt(id)*V<=B))near.push(id);
    else far.push(id);
  }
  const trips=[];
  // 1) cercanos: días dedicados a municipios grandes + viajes de un día por ahorros (Clarke-Wright)
  const pend=[];
  for(const id of near){
    let n=cnt(id);const cap=Math.max(1,Math.floor((B-2*dh(base,id))/V+1e-9));
    if(n>cap){const k=Math.ceil(n/cap);for(let i=0;i<k;i++){const q=Math.round(n*(i+1)/k)-Math.round(n*i/k);trips.push({kind:'local',stops:[{id,n:q}]})}}
    else pend.push({id,n});
  }
  const rt=r=>{let t=dh(base,r[0].id)+dh(r[r.length-1].id,base);for(let i=1;i<r.length;i++)t+=dh(r[i-1].id,r[i].id);return t+r.reduce((a,s)=>a+s.n*V,0)};
  const where=new Map(pend.map(s=>[s,[s]]));
  const sv=[];
  for(let i=0;i<pend.length;i++)for(let j=i+1;j<pend.length;j++){const a=pend[i],b=pend[j];sv.push([dh(base,a.id)+dh(base,b.id)-dh(a.id,b.id),a,b])}
  sv.sort((p,q)=>q[0]-p[0]);
  for(const [s,a,b] of sv){
    if(s<=0)break;
    const ra=where.get(a),rb=where.get(b);if(ra===rb)continue;
    const aE=ra[ra.length-1]===a,aS=ra[0]===a,bE=rb[rb.length-1]===b,bS=rb[0]===b;
    if(!(aE||aS)||!(bE||bS))continue;
    const m=(aE?ra:ra.slice().reverse()).concat(bS?rb:rb.slice().reverse());
    if(rt(m)>B)continue;
    m.forEach(st=>where.set(st,m));
  }
  // lo que queda en la propia base se suma a la primera salida donde quepa
  const bs=pend.find(st=>st.id===base);
  if(bs&&where.get(bs).length===1){const tgt=[...new Set(where.values())].filter(r=>r!==where.get(bs)).find(r=>rt([bs,...r])<=B);if(tgt){where.delete(bs);tgt.unshift(bs)}}
  for(const r of new Set(where.values())){
    const byId=new Map(r.map(s=>[s.id,s]));
    const ord=route([base,...r.map(s=>s.id).filter(i=>i!==base)],base,true).order.filter(i=>i!==base);
    const stops=ord.map(i=>byId.get(i));if(byId.has(base))stops.unshift(byId.get(base));
    trips.push({kind:'dia',stops});
  }
  const ang=t=>{const p=M.get(t.stops[0].id).properties,b=M.get(base).properties;return Math.atan2(p.cy-b.cy,p.cx-b.cx)};
  trips.sort((a,b)=>ang(a)-ang(b));
  // 2) lejanos: agrupar zonas (enlace simple ≤ 2.5 h entre municipios) y armar giras con pernocta
  const parent=new Map(far.map(i=>[i,i]));const find=i=>parent.get(i)===i?i:(parent.set(i,find(parent.get(i))),parent.get(i));
  for(let i=0;i<far.length;i++)for(let j=i+1;j<far.length;j++)if(dh(far[i],far[j])<=2.5)parent.set(find(far[i]),find(far[j]));
  const cl=d3.groups(far,find).map(d=>d[1]).sort((a,b)=>d3.min(a,i=>dh(base,i))-d3.min(b,i=>dh(base,i)));
  let gi=0;
  for(const c of cl){
    const ord=route([base,...c],base,true).order.filter(i=>i!==base);
    const big=d3.greatest(c,i=>cnt(i));
    trips.push({kind:'gira',name:`Gira ${++gi} · ${M.get(big).properties.n}${c.length>1?` y ${c.length-1} más`:''}`,stops:ord.map(id=>({id,n:cnt(id)}))});
  }
  // 3) simular jornadas: manejo + visitas dentro del límite de horas
  const days=[];
  for(const tr of trips){
    let pos=base,t=0,d;
    const open=()=>{d={trip:tr,from:pos,items:[],km:0,drive:0,visit:0,n:0};days.push(d);t=0};
    const close=at=>{d.end=at;d.hours=t};
    open();
    const transfer=(to,back)=>{ // tramo más largo que una jornada: día propio de traslado
      if(t>0){close(pos);open()}
      const h=dh(pos,to);d.transfer=true;d.items.push({type:'drive',to,at:0,h,km:dk(pos,to),back});d.drive+=h;d.km+=dk(pos,to);t=h;pos=to;
      if(!back){close(pos);open()}
    };
    for(const s of tr.stops){
      const h=dh(pos,s.id);
      if(h>B&&tr.kind==='gira'){transfer(s.id,false)}
      else if(t>0&&t+h+V>B){close(pos);open()}
      if(s.id!==pos){d.items.push({type:'drive',to:s.id,at:t,h,km:dk(pos,s.id)});t+=h;d.drive+=h;d.km+=dk(pos,s.id);pos=s.id}
      let n=s.n,done=s.from||0;
      while(n>0){
        let can=Math.floor((B-t)/V+1e-9);
        if(can<=0){close(pos);open();can=Math.max(1,Math.floor(B/V))}
        const take=Math.min(n,can);
        d.items.push({type:'visit',id:s.id,n:take,from:done,at:t,h:take*V});t+=take*V;d.visit+=take*V;d.n+=take;n-=take;done+=take;
      }
    }
    if(pos!==base&&dh(pos,base)>B&&tr.kind==='gira'){transfer(base,true)}
    else if(pos!==base){
      const h=dh(pos,base);
      if(t>0&&t+h>B&&tr.kind==='gira'){close(pos);open()}
      d.items.push({type:'drive',to:base,at:t,h,km:dk(pos,base),back:true});t+=h;d.drive+=h;d.km+=dk(pos,base);
    }
    close(base);
  }
  // índice de inmuebles ya visitados por municipio (para partir municipios grandes en varios días)
  const seenN=new Map();
  for(const d of days)for(const it of d.items)if(it.type==='visit'){it.from=seenN.get(it.id)||0;seenN.set(it.id,it.from+it.n)}
  // fechas
  if(!CFG.start)CFG.start=nextMonday();
  let dt=new Date(CFG.start+'T12:00:00');
  for(const d of days){
    if(CFG.habiles)while(dt.getDay()===0||dt.getDay()===6)dt.setDate(dt.getDate()+1);
    d.date=new Date(dt);dt.setDate(dt.getDate()+1);
  }
  return{days,trips,base,B,ids};
}

const dfmt=new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short'});
const inmOf=(g,id)=>ROWS.filter(r=>r[C.cve]===id&&r[C.gestor]===g&&S.proy.has(r[C.proyecto])&&S.est.has(r[C.estatus])).sort((a,b)=>a[C.nombre].localeCompare(b[C.nombre]));

function gmaps(d){
  const pts=[d.from,...d.items.filter(i=>i.type==='drive').map(i=>i.to)];
  const u=[...new Set(pts)].length<2?null:pts;
  if(!u)return null;
  const mid=u.slice(1,-1).slice(0,9);
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${encodeURIComponent(place(u[0]))}&destination=${encodeURIComponent(place(u[u.length-1]))}${mid.length?'&waypoints='+encodeURIComponent(mid.map(place).join('|')):''}`;
}

function matrix(ids,c){

  const col=d3.scaleSequential(d3.interpolateRgb('transparent',c)).domain([0,far]);
  return `<div class="tblwrap"><table class="matrix"><thead><tr><th></th>${ids.map((id,i)=>`<th title="${M.get(id).properties.n}">${i+1}</th>`).join('')}</tr></thead><tbody>${ids.map((a,i)=>`<tr><th class="rh" title="${M.get(a).properties.n}">${i+1} ${M.get(a).properties.n}</th>${ids.map(b=>`<td style="background:${a===b?'transparent':col(dk(a,b))}">${a===b?'·':Math.round(dk(a,b))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function planCSV(g){
  const L=['jornada,fecha,tipo,hora,accion,municipio,estado,inmuebles,km,horas'];
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  PLAN.days.forEach((d,i)=>{
    const f=d.date.toISOString().slice(0,10),k=q(kindLbl(d));
    L.push([i+1,f,k,clock(0),'salida',q(M.get(d.from).properties.n),q(M.get(d.from).properties.s),'','',''].join(','));
    for(const it of d.items){
      if(it.type==='drive')L.push([i+1,f,k,clock(it.at),it.back?'regreso':'manejo',q(M.get(it.to).properties.n),q(M.get(it.to).properties.s),'',it.km.toFixed(0),it.h.toFixed(2)].join(','));
      else{const names=inmOf(g,it.id).slice(it.from,it.from+it.n).map(r=>r[C.id]+' '+r[C.nombre]).join('; ');
        L.push([i+1,f,k,clock(it.at),'visita',q(M.get(it.id).properties.n),q(M.get(it.id).properties.s),q(names),'',it.h.toFixed(2)].join(','))}
    }
    if(d.end!==S.base)L.push([i+1,f,k,clock(d.hours),'pernocta',q(M.get(d.end).properties.n),q(M.get(d.end).properties.s),'','',''].join(','));
  });
  return L.join('\n');
}

function refresh(){aggregate();kpis();glist();paint();renderTab();drawOverlay()}
const sinUbicar=ROWS.filter(r=>!r[C.cve]).length;
$('#fuente').textContent=`${inm.fuente} · límites municipales INEGI 2023${sinUbicar?` · ${sinUbicar} inmueble sin municipio reconocido`:''}`;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>paint());
new MutationObserver(()=>paint()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
refresh();
})();
</script>
